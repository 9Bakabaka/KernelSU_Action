name: Build Kernel

on:
  workflow_dispatch:
    # GitHub allows at most 10 workflow_dispatch inputs, so these are the knobs
    # worth changing per-run. Everything else lives in the config file selected
    # by `config`, so a fork can keep one profile per device.
    inputs:
      config:
        description: "Config file to build (path, relative to the repo root)"
        required: false
        default: "config.env"
        type: string
      # "config" on the options below means "use whatever the config file says".
      # It is the default so that running the form without touching anything
      # reproduces exactly what your profile describes.
      ksu_variant:
        description: "KernelSU variant"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - none
          - kernelsu
          - kernelsu-next
          - sukisu-ultra
          - resukisu
          - rsuntk
          - backslashxx
      ksu_ref:
        description: "KernelSU branch/tag/commit (blank = best default for your kernel)"
        required: false
        default: ""
        type: string
      hook_mode:
        description: "Syscall hook mechanism"
        required: false
        default: "config"
        type: choice
        options: [config, auto, kprobes, manual, tracepoint, syscall, none]
      susfs:
        description: "Apply SUSFS (mount/root hiding)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      path_umount:
        description: "Backport path_umount() (needed on kernels older than 5.9)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      hide_stuff:
        description: "Apply hide_stuff (extra fingerprint removal)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      kpm:
        description: "Enable KPM (SukiSU-Ultra only)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      extra_defconfig:
        description: "Extra defconfig lines, space separated (e.g. CONFIG_TMPFS_XATTR=y)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish the build as a GitHub Release"
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      config:          { required: false, default: "config.env", type: string }
      ksu_variant:     { required: false, default: "config",     type: string }
      ksu_ref:         { required: false, default: "",           type: string }
      hook_mode:       { required: false, default: "config",     type: string }
      susfs:           { required: false, default: "config",     type: string }
      path_umount:     { required: false, default: "config",     type: string }
      hide_stuff:      { required: false, default: "config",     type: string }
      kpm:             { required: false, default: "config",     type: string }
      extra_defconfig: { required: false, default: "",           type: string }
      publish_release: { required: false, default: false,        type: boolean }

# Only one build per ref at a time; a newer run supersedes an older one.
concurrency:
  group: build-kernel-${{ github.ref }}-${{ inputs.config }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.config }}
    # Pinned on purpose: `ubuntu-latest` is mid-migration to Ubuntu 26, and a
    # 4.19 kernel must be built against a toolchain/system combination that does
    # not change under us between runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      device: ${{ steps.meta.outputs.device }}
      build_time: ${{ steps.meta.outputs.build_time }}
      ksu_name: ${{ steps.meta.outputs.ksu_name }}
      ksu_version: ${{ steps.meta.outputs.ksu_version }}
      kernel_release: ${{ steps.meta.outputs.kernel_release }}
      susfs_version: ${{ steps.meta.outputs.susfs_version }}
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: ${{ inputs.config }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      DEBIAN_FRONTEND: "noninteractive"

      # workflow inputs -> IN_* overrides consumed by scripts/config.sh
      IN_KSU_VARIANT: ${{ inputs.ksu_variant }}
      IN_KSU_REF: ${{ inputs.ksu_ref }}
      IN_KSU_HOOK_MODE: ${{ inputs.hook_mode }}
      IN_ENABLE_SUSFS: ${{ inputs.susfs }}
      IN_ENABLE_PATH_UMOUNT: ${{ inputs.path_umount }}
      IN_ENABLE_HIDE_STUFF: ${{ inputs.hide_stuff }}
      IN_ENABLE_KPM: ${{ inputs.kpm }}
      IN_EXTRA_DEFCONFIG: ${{ inputs.extra_defconfig }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve configuration
        run: bash scripts/config.sh

      # Do NOT use jlumbroso/free-disk-space here. Its `large-packages` option
      # runs `apt-get remove -y <hardcoded list> --fix-missing`; on the newer
      # runner images several of those packages no longer exist, the removal
      # exits 100 and leaves dpkg half-configured, which then makes the very
      # next apt-get call fail with the same exit code. Deleting directories is
      # equally effective and cannot corrupt the package database.
      - name: Free up disk space
        if: env.REMOVE_UNUSED_PACKAGES == 'true'
        run: |
          set -x
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules \
            /opt/az \
            /usr/share/swift || true
          sudo apt-get clean || true
          docker image prune -af || true
          sudo rm -rf /var/lib/docker/aufs /var/lib/docker/overlay2/* || true
          df -h /

      - name: Add swap space
        run: |
          # LTO links are memory-hungry and the runner has 16GB; a swap file is
          # cheaper and more predictable than an unpinned third-party action.
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          set -o pipefail

          # Real cause of the earlier exit-100 failures: the runner image points
          # apt at azure.archive.ubuntu.com, which does not resolve from this
          # runner ("Temporary failure resolving"). apt then burns ~8 minutes
          # timing out every repository and exits 100. So: rewrite the sources to
          # a plain upstream mirror, try a few, and decide whether the build can
          # continue by looking for the actual host tools -- not by trusting apt.
          APT_LOG="${RUNNER_TEMP:-/tmp}/apt.log"
          : > "$APT_LOG"

          # shellcheck source=/dev/null
          . /etc/os-release
          SUITE="${UBUNTU_CODENAME:-${VERSION_CODENAME:-noble}}"
          echo "ubuntu codename: $SUITE"

          APT=(
            -y --no-install-recommends
            -o DPkg::Lock::Timeout=180
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o Dpkg::Options::=--force-confdef
            -o Dpkg::Options::=--force-confold
          )

          PKGS=(
            bc bison build-essential ccache cpio curl device-tree-compiler flex
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd
            libncurses-dev
          )

          set_mirror() {
            local uri=$1
            printf 'Types: deb\nURIs: %s\nSuites: %s %s-updates %s-backports %s-security\nComponents: main restricted universe multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' \
              "$uri" "$SUITE" "$SUITE" "$SUITE" "$SUITE" \
              | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null
            printf '%s/\n' "$uri" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          }

          sudo dpkg --configure -a 2>&1 | tee -a "$APT_LOG" >/dev/null || true

          MIRRORS=(
            "http://archive.ubuntu.com/ubuntu"
            "https://mirrors.edge.kernel.org/ubuntu"
            "http://mirrors.aliyun.com/ubuntu"
            "http://azure.archive.ubuntu.com/ubuntu"
          )

          want=()
          for m in "${MIRRORS[@]}"; do
            want=()
            for p in "${PKGS[@]}"; do
              dpkg -s "$p" >/dev/null 2>&1 || want+=("$p")
            done
            if [ ${#want[@]} -eq 0 ]; then
              echo "all build dependencies already present"
              break
            fi

            host="${m#*://}"
            host="${host%%/*}"
            if ! getent hosts "$host" >/dev/null 2>&1; then
              echo "::warning::DNS lookup failed for $host, skipping this mirror"
              continue
            fi

            echo "=== mirror $m ; missing: ${want[*]} ==="
            set_mirror "$m"

            if timeout 180 sudo apt-get "${APT[@]}" update 2>&1 | tee -a "$APT_LOG" >/dev/null; then
              echo "apt-get update ok via $m"
              timeout 600 sudo apt-get "${APT[@]}" install "${want[@]}" 2>&1 | tee -a "$APT_LOG" >/dev/null || true
            else
              echo "::warning::apt-get update failed via $m"
            fi
          done

          still=()
          for p in "${PKGS[@]}"; do
            dpkg -s "$p" >/dev/null 2>&1 || still+=("$p")
          done
          echo "apt packages still missing: ${still[*]:-none}"
          if [ ${#still[@]} -gt 0 ]; then
            # Surfaced as an annotation on purpose: the job log needs auth to
            # download, annotations can be read from the public API.
            echo "::warning::apt packages still missing, continuing with what the image has: ${still[*]}"
          fi

          # What actually matters for the kernel build.
          NO_TOOLS=()
          for t in make gcc bison flex bc cpio python3 perl tar gzip git; do
            command -v "$t" >/dev/null 2>&1 || NO_TOOLS+=("$t")
          done
          echo "host tools still missing: ${NO_TOOLS[*]:-none}"

          if [ ${#NO_TOOLS[@]} -gt 0 ]; then
            echo "::error::host tools required by the kernel build are unavailable: ${NO_TOOLS[*]}"
            tail -n 40 "$APT_LOG" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::APT| ${line}"
            done
            exit 1
          fi

          # ccache is only a speed-up; drop the ccache step instead of failing.
          if ! command -v ccache >/dev/null 2>&1; then
            echo "::warning::ccache unavailable, disabling the ccache step"
            echo "ENABLE_CCACHE=false" >> "$GITHUB_ENV"
          fi

          # libssl-dev is only pulled in by scripts/sign-file. Without it the
          # kernel still builds and boots, it just cannot sign modules itself.
          if ! dpkg -s libssl-dev >/dev/null 2>&1; then
            echo "::warning::libssl-dev unavailable, building with CONFIG_MODULE_SIG=n"
            echo "EXTRA_DEFCONFIG=${EXTRA_DEFCONFIG:-} CONFIG_MODULE_SIG=n" >> "$GITHUB_ENV"
          fi

          mkdir -p "$WORKSPACE"

      - name: Set up toolchain
        run: bash scripts/toolchain.sh

      - name: Fetch kernel source
        run: bash scripts/source.sh

      - name: Install KernelSU
        if: env.KSU_VARIANT != 'none'
        run: bash scripts/kernelsu.sh

      - name: Apply kernel patches
        run: bash scripts/patches.sh all

      - name: Set up ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ env.DEVICE }}-${{ env.KSU_VARIANT }}-${{ env.KERNEL_VERSION }}
          max-size: 2G

      - name: Build kernel
        run: bash scripts/build.sh all

      - name: Package artifacts
        run: bash scripts/package.sh all

      - name: Export build metadata
        id: meta
        run: |
          {
            echo "device=${DEVICE}"
            echo "build_time=${BUILD_TIME}"
            echo "ksu_name=${KSU_NAME:-none}"
            echo "ksu_version=${KSU_VERSION_LABEL:-}"
            echo "kernel_release=${KERNEL_RELEASE:-}"
            echo "susfs_version=${SUSFS_VERSION:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_IMAGE_NAME }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}
          if-no-files-found: error

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/AnyKernel3/*
          if-no-files-found: error

      - name: Upload DTBO image
        if: env.CHECK_DTBO_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dtbo-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img

      - name: Upload boot image
        if: env.MAKE_BOOT_IMAGE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: boot${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/boot.img

  # Publishing is a separate job so the build itself runs with a read-only
  # token; only this job gets contents:write, and only when asked for.
  release:
    name: Publish release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Package AnyKernel3 as a flashable zip
        run: |
          mkdir -p release
          shopt -s nullglob
          for dir in artifacts/AnyKernel3*/; do
            name=$(basename "${dir%/}")
            (cd "$dir" && zip -qr9 "${GITHUB_WORKSPACE}/release/${name}.zip" .)
            echo "packed ${name}.zip"
          done
          for f in artifacts/*/Image* artifacts/*/boot.img artifacts/*/dtbo.img; do
            [ -f "$f" ] && cp "$f" release/
          done
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ needs.build.outputs.device }}-${{ needs.build.outputs.build_time }}
          name: ${{ needs.build.outputs.device }} · ${{ needs.build.outputs.ksu_name }} · ${{ needs.build.outputs.build_time }}
          body: |
            | | |
            | --- | --- |
            | Device | `${{ needs.build.outputs.device }}` |
            | Kernel | `${{ needs.build.outputs.kernel_release }}` |
            | KernelSU | `${{ needs.build.outputs.ksu_name }}` @ `${{ needs.build.outputs.ksu_version }}` |
            | SUSFS | `${{ needs.build.outputs.susfs_version || 'not applied' }}` |

            Flash the AnyKernel3 zip from a custom recovery.
          files: release/*
